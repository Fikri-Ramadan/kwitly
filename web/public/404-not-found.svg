<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 450" width="420" height="450" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Halaman tidak ditemukan</title>
  <desc id="d">Lembar invoice miring bertuliskan 404 dengan stempel merah "Tidak ditemukan"</desc>
  <defs>
